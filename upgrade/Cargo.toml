[package]
name = "simple-mod-framework-upgrade"
version = "0.0.0"
edition = "2024"

[dependencies]
simple-mod-framework-core.workspace = true
simple-mod-framework-types.workspace = true

color-eyre.workspace = true
ecow.workspace = true
fn-wrap-err.workspace = true
glacier-bin1 = { workspace = true, features = ["h3", "TEMP", "TBLU"] }
glacier-commons = { workspace = true, features = [
    "serde",
    "specta",
    "schemars",
    "rpkg-rs-2",
    "tonytools",
    "hash-list",
    "game-detection",
] }
glacier-formats = { workspace = true, features = [
    "serde",
    "sdef",
    "material",
    "wwev",
    "texture",
] }
image.workspace = true
indexmap.workspace = true
lazy-regex.workspace = true
quickentity-3.workspace = true
quickentity-31.workspace = true
quickentity-rs = { workspace = true, features = ["h3"] }
rayon.workspace = true
relative-path.workspace = true
rpkg-rs.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
serde_json5.workspace = true
serde.workspace = true
specta = { workspace = true, features = ["url", "uuid", "indexmap"] }
tempfile.workspace = true
tonytools.workspace = true
tryvial.workspace = true
typify.workspace = true
walkdir.workspace = true
xxhash-rust = { workspace = true, features = ["xxh3"] }
semver.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }
