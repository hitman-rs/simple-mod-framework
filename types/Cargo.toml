[package]
name = "simple-mod-framework-types"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
color-eyre.workspace = true
glacier-commons = { workspace = true, features = [
    "serde",
    "specta",
    "schemars",
    "rpkg-rs-2",
    "tonytools",
    "hash-list",
    "rune",
] }
papaya.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
itertools.workspace = true
lazy-regex.workspace = true
mident.workspace = true
schemars = { workspace = true, features = [
    "semver1",
    "url2",
    "uuid1",
    "indexmap2",
] }
semver = { workspace = true, features = ["serde"] }
tryvial.workspace = true
url = { workspace = true, features = ["serde"] }
validated_newtype.workspace = true
regex.workspace = true
relative-path = { workspace = true, features = ["serde"] }
rapidhash.workspace = true
vec1 = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["serde"] }
indexmap = { workspace = true, features = ["serde"] }
specta = { workspace = true, features = [
    "url",
    "uuid",
    "indexmap",
    "serde_json",
] }
rune.workspace = true
better-rune-derive.workspace = true
serde_with.workspace = true
rkyv.workspace = true
log.workspace = true
fn-wrap-err.workspace = true
ecow = { workspace = true, features = ["serde"] }
